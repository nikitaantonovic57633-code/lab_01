[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "toolkit"
version = "0.1.0"
description = "Консольный набор утилит: калькулятор выражений и конвертер величин."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Никита Равкин", email = "nikitaantonovic57633@gmail.com" }]

[project.scripts]
toolkit = "toolkit.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 79